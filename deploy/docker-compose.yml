services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://lalaland:lalaland@postgres:5432/lalaland?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: "${JWT_SECRET:-change-me}"
      HMAC_SECRET: "${HMAC_SECRET:-change-me}"
      ADMIN_USERS: "${ADMIN_USERS:-admin}"
      ADMIN_PASSWORDS: "${ADMIN_PASSWORDS:-change-me-admin}"
      CHECKER_USER: "${CHECKER_USER:-checker}"
      CHECKER_PASSWORD: "${CHECKER_PASSWORD:-change-me-checker}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      RATE_LIMIT_WINDOW: "${RATE_LIMIT_WINDOW:-1m}"
      RATE_LIMIT_GENERIC_MAX: "${RATE_LIMIT_GENERIC_MAX:-300}"
      RATE_LIMIT_BOOKING_MAX: "${RATE_LIMIT_BOOKING_MAX:-1200}"
      RUN_MIGRATIONS: "true"
      SEED_SEATS: "true"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lalaland
      POSTGRES_USER: lalaland
      POSTGRES_PASSWORD: lalaland
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lalaland -d lalaland"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
  backups:
