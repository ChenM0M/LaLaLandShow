services:
  app:
    image: "${APP_IMAGE:?set APP_IMAGE}:${IMAGE_TAG:?set IMAGE_TAG}"
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-18088}:8080"
    environment:
      APP_ENV: "${APP_ENV:-standalone}"
      HTTP_ADDR: ":8080"
      STATIC_DIR: "/app/public"
      POSTGRES_DB: "${POSTGRES_DB:-lalaland}"
      POSTGRES_USER: "${POSTGRES_USER:-lalaland}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-lalaland}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-lalaland}:${POSTGRES_PASSWORD:-lalaland}@127.0.0.1:5432/${POSTGRES_DB:-lalaland}?sslmode=disable"
      REDIS_URL: "redis://127.0.0.1:6379/0"
      DB_MAX_CONNS: "${DB_MAX_CONNS:-12}"
      DB_MIN_CONNS: "${DB_MIN_CONNS:-1}"
      DB_MAX_CONN_LIFETIME: "${DB_MAX_CONN_LIFETIME:-1h}"
      DB_MAX_CONN_IDLE_TIME: "${DB_MAX_CONN_IDLE_TIME:-5m}"
      JWT_SECRET: "${JWT_SECRET:-standalone-jwt-secret-not-for-production}"
      HMAC_SECRET: "${HMAC_SECRET:-standalone-hmac-secret-not-for-production}"
      ADMIN_USERS: "${ADMIN_USERS:-admin}"
      ADMIN_PASSWORDS: "${ADMIN_PASSWORDS:-admin}"
      CHECKER_USER: "${CHECKER_USER:-checker}"
      CHECKER_PASSWORD: "${CHECKER_PASSWORD:-checker}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      RATE_LIMIT_WINDOW: "${RATE_LIMIT_WINDOW:-1m}"
      RATE_LIMIT_GENERIC_MAX: "${RATE_LIMIT_GENERIC_MAX:-300}"
      RATE_LIMIT_BOOKING_MAX: "${RATE_LIMIT_BOOKING_MAX:-1200}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      SEED_SEATS: "${SEED_SEATS:-true}"
    volumes:
      - app-data:/data

volumes:
  app-data:
