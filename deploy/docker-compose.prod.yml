services:
  app:
    image: "${APP_IMAGE:?set APP_IMAGE}:${IMAGE_TAG:?set IMAGE_TAG}"
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-18088}:80"
    environment:
      APP_ENV: "${APP_ENV:-production}"
      HTTP_ADDR: "127.0.0.1:8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-lalaland}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lalaland}?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      DB_MAX_CONNS: "${DB_MAX_CONNS:-12}"
      DB_MIN_CONNS: "${DB_MIN_CONNS:-1}"
      DB_MAX_CONN_LIFETIME: "${DB_MAX_CONN_LIFETIME:-1h}"
      DB_MAX_CONN_IDLE_TIME: "${DB_MAX_CONN_IDLE_TIME:-5m}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      HMAC_SECRET: "${HMAC_SECRET:?set HMAC_SECRET}"
      ADMIN_USERS: "${ADMIN_USERS:?set ADMIN_USERS}"
      ADMIN_PASSWORDS: "${ADMIN_PASSWORDS:?set ADMIN_PASSWORDS}"
      CHECKER_USER: "${CHECKER_USER:?set CHECKER_USER}"
      CHECKER_PASSWORD: "${CHECKER_PASSWORD:?set CHECKER_PASSWORD}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      RATE_LIMIT_WINDOW: "${RATE_LIMIT_WINDOW:-1m}"
      RATE_LIMIT_GENERIC_MAX: "${RATE_LIMIT_GENERIC_MAX:-300}"
      RATE_LIMIT_BOOKING_MAX: "${RATE_LIMIT_BOOKING_MAX:-1200}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      SEED_SEATS: "${SEED_SEATS:-true}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-lalaland}"
      POSTGRES_USER: "${POSTGRES_USER:-lalaland}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lalaland} -d ${POSTGRES_DB:-lalaland}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-lalaland}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lalaland}?sslmode=disable"
      BACKUP_DIR: "/backups"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-86400}"
    volumes:
      - backups:/backups
      - ./backup.sh:/usr/local/bin/lalaland-backup:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        while true; do
          sh /usr/local/bin/lalaland-backup
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done

volumes:
  postgres-data:
  redis-data:
  backups:
